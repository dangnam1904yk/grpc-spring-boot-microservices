# Chạy toàn bộ hệ thống (3 database + Kafka + các service):
#   docker compose up -d --build
#   docker compose logs -f category business
# Gateway: http://localhost:8080 (đổi port: GATEWAY_PORT=8085 docker compose up -d)
# Keycloak: http://localhost:8180 (đăng nhập admin@example.com / Admin@123; console quản trị admin / admin)
# Eureka dashboard: http://localhost:8761
# Mật khẩu có thể ghi đè bằng file .env (xem .env.example)
name: grpc-microservices

x-service-env: &service-env
  EUREKA_URL: http://discovery:8761/eureka
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
  # Mọi service tự kiểm tra JWT bằng public key của Keycloak; issuer là URL trình duyệt thấy (KC_HOSTNAME)
  JWT_JWKS_URI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
  JWT_ISSUER: http://localhost:${KEYCLOAK_PORT:-8180}/realms/ecommerce
  # Cache role + quyền theo user (common-grpc: RedisAuthorityCache)
  REDIS_HOST: redis
  # Audit log đi qua Kafka (common-grpc: KafkaAuditSink -> topic audit-log)
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # Đường gửi audit log dự phòng qua gRPC (AUDIT_TRANSPORT=grpc); khoá phải giống nhau ở mọi service
  AUDIT_TRANSPORT: ${AUDIT_TRANSPORT:-kafka}
  AUDIT_KEY: ${AUDIT_KEY:-dev-audit-key}

x-service-build: &service-build
  context: .
  dockerfile: Dockerfile

services:
  # ---------------- Hạ tầng ----------------
  discovery:
    build:
      <<: *service-build
      args: { SERVICE: discovery }
    image: grpc-ms/discovery
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 512m

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # SQL Server bắt buộc mật khẩu SA đủ mạnh (hoa, thường, số, ký tự đặc biệt)
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dangnam@2024}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # SQL Server không tự tạo database như MySQL -> tạo micro_category một lần rồi thoát
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dangnam@2024}
    entrypoint:
      - /bin/sh
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "IF DB_ID('micro_category') IS NULL CREATE DATABASE micro_category"
    restart: "no"

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle}
      # Tạo user hr trong pluggable database FREEPDB1
      APP_USER: hr
      APP_USER_PASSWORD: ${ORACLE_HR_PASSWORD:-hr}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dangnam}
      MYSQL_DATABASE: micro_customer
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Audit log: các service gửi vào topic audit-log, audit-service đọc ra ghi DB (KRaft, không cần ZooKeeper)
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 1 broker -> mọi topic nội bộ chỉ 1 bản sao
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 768m

  # Cache role + quyền theo user, dùng chung giữa các service (auth-service xoá khi phân quyền đổi).
  # Chỉ là cache: mất dữ liệu không sao, nên không cần volume
  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m

  # Đăng nhập (OIDC): tài khoản, mật khẩu, phiên. Role của user do auth-service quản lý. Realm "ecommerce" được import từ
  # keycloak/realm-ecommerce.json lần đầu (khi realm chưa có trong DB). Console: http://localhost:8180/admin
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Dùng chung MySQL với các service (database keycloak) để giữ user / realm qua các lần down / up
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?createDatabaseIfNotExist=true
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dangnam}
      # Issuer (claim iss) cố định theo URL trình duyệt dùng; service trong mạng Docker vẫn gọi được
      # http://keycloak:8080 (JWKS, Admin API) nhờ backchannel động
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Thay placeholder trong realm-ecommerce.json lúc import
      AUTH_SERVICE_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-auth-service-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm-ecommerce.json:/opt/keycloak/data/import/realm-ecommerce.json:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Image không có curl: gọi /health/ready (management port 9000) bằng /dev/tcp của bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Lần đầu Keycloak tạo schema trên MySQL (Liquibase), có thể mất hơn 10 phút trên Docker Desktop
      start_period: 20m

  # ---------------- Service ----------------
  auth:
    build:
      <<: *service-build
      args: { SERVICE: auth }
    image: grpc-ms/auth
    environment:
      <<: *service-env
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dangnam}
      # Keycloak Admin API (service account của client auth-service)
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-auth-service-secret}
    depends_on:
      redis:
        condition: service_healthy
      discovery:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 768m

  category:
    build:
      <<: *service-build
      args: { SERVICE: category }
    image: grpc-ms/category
    environment:
      <<: *service-env
      DB_HOST: mssql
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-Dangnam@2024}
    depends_on:
      redis:
        condition: service_healthy
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mssql-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7777/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 768m

  customer:
    build:
      <<: *service-build
      args: { SERVICE: customer }
    image: grpc-ms/customer
    environment:
      <<: *service-env
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dangnam}
    depends_on:
      redis:
        condition: service_healthy
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8990/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 768m

  business:
    build:
      <<: *service-build
      args: { SERVICE: business }
    image: grpc-ms/business
    environment:
      <<: *service-env
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USERNAME: hr
      DB_PASSWORD: ${ORACLE_HR_PASSWORD:-hr}
    depends_on:
      redis:
        condition: service_healthy
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      oracle:
        condition: service_healthy
      # business gọi category/customer qua gRPC; vẫn khởi động được nếu chúng chưa sẵn sàng
      # (API đọc sẽ degrade, API tạo trả 503), nhưng đợi để tránh lỗi lúc vừa bật
      category:
        condition: service_healthy
      customer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 768m

  # Nhận audit log (IP, curl, request, response, thay đổi dữ liệu) từ mọi service
  audit:
    build:
      <<: *service-build
      args: { SERVICE: audit }
    image: grpc-ms/audit
    environment:
      <<: *service-env
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dangnam}
    depends_on:
      redis:
        condition: service_healthy
      discovery:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8777/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s
    mem_limit: 768m

  apigateway:
    build:
      <<: *service-build
      args: { SERVICE: apigateway }
    image: grpc-ms/apigateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *service-env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 512m

volumes:
  kafka-data:
  mssql-data:
  oracle-data:
  mysql-data:
