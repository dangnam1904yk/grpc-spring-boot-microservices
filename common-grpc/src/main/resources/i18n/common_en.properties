# Messages of the shared error handling (common-grpc). A service can override a key in i18n/messages_en.properties.
# Messages with arguments ({0}, {1}...) go through MessageFormat: write ' as ''.
error.invalid=Invalid data
error.required=This field is required
error.type-mismatch=Invalid data type
error.invalid-json=Request body is not valid JSON
error.not-uuid=Not a valid UUID
error.not-uuid.detail={0} is not a valid UUID: {1}
error.concurrent-update=The data was changed by another request, please reload and try again
error.dependency=A dependent service failed
error.system=Internal server error
error.unauthenticated=Not signed in, or the token is invalid / expired
error.forbidden=You do not have permission to perform this action

# Shared validation annotations (@CustomRequired, @CustomMaxLength, @CustomMinLength, @CustomRegex).
# {fieldLabel} = the annotation's label (key or text), validation.label.default when empty; {max}, {min}, {regexp}
# = annotation attributes. Not formatted with MessageFormat (' stays as is).
validation.label.default=This field
validation.required={fieldLabel} is required
validation.max-length={fieldLabel} must be at most {max} characters
validation.min-length={fieldLabel} must be at least {min} characters
validation.regex={fieldLabel} has an invalid format
