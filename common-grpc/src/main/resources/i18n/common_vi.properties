# Message của phần xử lý lỗi chung (common-grpc). Service đặt lại được bằng cùng key trong i18n/messages_vi.properties.
# Message có tham số ({0}, {1}...) đi qua MessageFormat: dấu ' phải viết thành ''.
error.invalid=Dữ liệu không hợp lệ
error.required=Trường thông tin là bắt buộc
error.type-mismatch=Sai kiểu dữ liệu
error.invalid-json=Body không đúng định dạng JSON
error.not-uuid=Không phải UUID hợp lệ
error.not-uuid.detail={0} không phải UUID hợp lệ: {1}
error.concurrent-update=Dữ liệu đã bị thay đổi bởi request khác, vui lòng tải lại và thử lại
error.dependency=Service phụ thuộc lỗi
error.system=Lỗi hệ thống
error.unauthenticated=Chưa đăng nhập hoặc token không hợp lệ / đã hết hạn
error.forbidden=Không có quyền thực hiện thao tác này

# Annotation validate dùng chung (@CustomRequired, @CustomMaxLength, @CustomMinLength, @CustomRegex).
# {fieldLabel} = label của annotation (key hoặc chữ), trống thì là validation.label.default; {max}, {min}, {regexp}
# = tham số của annotation. Message không qua MessageFormat (giữ nguyên dấu ').
validation.label.default=Trường thông tin
validation.required={fieldLabel} là bắt buộc
validation.max-length={fieldLabel} không được vượt quá {max} ký tự
validation.min-length={fieldLabel} phải có ít nhất {min} ký tự
validation.regex={fieldLabel} không đúng định dạng
