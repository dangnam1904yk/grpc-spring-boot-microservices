# Chỉ chạy hạ tầng: 3 database + Kafka + Keycloak + Redis (mở port ra máy host) để chạy service local bằng IDE / mvn spring-boot:run:
#   docker compose -f docker-compose.db.yml up -d
#   docker compose -f docker-compose.db.yml ps          # đợi tất cả "healthy" (Oracle lần đầu ~1-2 phút)
#   ./scripts/run-local.ps1 <service>   (PowerShell)  hoặc  ./scripts/run-local.sh <service>   (bash)
#   -> script đặt DB_PORT / DB_PASSWORD / DB_URL / KAFKA_BOOTSTRAP_SERVERS rồi chạy service
#
# Port host mặc định lệch khỏi port chuẩn (13306 / 11433 / 11521 / 19092 / 16379) để không đụng MySQL / SQL Server /
# Oracle / Kafka cài sẵn trên máy. Đổi bằng biến MYSQL_PORT, MSSQL_PORT, ORACLE_PORT, KAFKA_PORT, REDIS_PORT (hoặc file .env).
# Dữ liệu giữ trong volume riêng, không dùng chung với docker-compose.yml.
#   docker compose -f docker-compose.db.yml down        # tắt, giữ dữ liệu
#   docker compose -f docker-compose.db.yml down -v     # tắt và xoá dữ liệu
name: grpc-microservices-db

services:
  # Audit log: service chạy local kết nối localhost:19092 (KAFKA_PORT)
  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: trong mạng Docker; HOST: từ máy host (service chạy bằng IDE / mvn)
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:${KAFKA_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-19092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # auth (micro_auth), customer (micro_customer), audit (micro_audit): database tự tạo khi service kết nối
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dangnam}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Cache role + quyền theo user, dùng chung giữa các service (auth-service xoá khi phân quyền đổi).
  # Chỉ là cache: mất dữ liệu không sao, nên không cần volume
  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 192m

  # Đăng nhập (OIDC): tài khoản, mật khẩu, phiên. Role của user do auth-service quản lý. Realm "ecommerce" được import từ
  # keycloak/realm-ecommerce.json lần đầu (khi realm chưa có trong DB). Console: http://localhost:8180/admin
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Dùng MySQL bên dưới (database keycloak) để giữ user / realm qua các lần down / up
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?createDatabaseIfNotExist=true
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dangnam}
      # Issuer (claim iss) cố định theo URL trình duyệt dùng; service trong mạng Docker vẫn gọi được
      # http://keycloak:8080 (JWKS, Admin API) nhờ backchannel động
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Thay placeholder trong realm-ecommerce.json lúc import
      AUTH_SERVICE_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-auth-service-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./keycloak/realm-ecommerce.json:/opt/keycloak/data/import/realm-ecommerce.json:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # Image không có curl: gọi /health/ready (management port 9000) bằng /dev/tcp của bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Lần đầu Keycloak tạo schema trên MySQL (Liquibase), có thể mất hơn 10 phút trên Docker Desktop
      start_period: 20m

  # category (micro_category)
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      # SQL Server bắt buộc mật khẩu SA đủ mạnh (hoa, thường, số, ký tự đặc biệt)
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dangnam@2024}
    ports:
      - "${MSSQL_PORT:-11433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # SQL Server không tự tạo database như MySQL -> tạo micro_category một lần rồi thoát
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Dangnam@2024}
    entrypoint:
      - /bin/sh
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "IF DB_ID('micro_category') IS NULL CREATE DATABASE micro_category"
    restart: "no"

  # business: user hr trong pluggable database FREEPDB1
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-oracle}
      APP_USER: hr
      APP_USER_PASSWORD: ${ORACLE_HR_PASSWORD:-hr}
    ports:
      - "${ORACLE_PORT:-11521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  kafka-data:
  mysql-data:
  mssql-data:
  oracle-data:
