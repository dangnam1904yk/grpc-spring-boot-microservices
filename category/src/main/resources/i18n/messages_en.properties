# Messages of category-service (English). Same keys as messages_vi.properties.
# Shared keys (error.required, error.invalid...) live in common-grpc (i18n/common_en.properties) and can be overridden here.
# Messages with arguments go through MessageFormat: write ' as '', use {0,number,#} for numbers to avoid grouping.

# Catalog names, used as argument {0} of the catalog.* messages
catalog.label.category=Category
catalog.label.unit=Unit

catalog.not-found.id={0} id={1} not found
catalog.not-found.code={0} code={1} not found
catalog.already-exists={0} code={1} already exists
catalog.code.exists=Already exists
catalog.version-conflict={0} was changed by another request (current version={1})
catalog.too-long=Must be at most {0,number,#} characters
catalog.batch.too-many=At most {0,number,#} codes per call
catalog.sort.unsupported=Cannot sort by field {0}
catalog.sort.invalid=Invalid: {0}

category.parent.self=A category cannot be its own parent
category.parent.not-found=Parent category does not exist
category.has-children=Category code={0} has child categories and cannot be deleted
category.get.key-required=Either id or code is required
