spring:
    datasource:
        url: jdbc:h2:mem:auth;MODE=MySQL;DB_CLOSE_DELAY=-1
        username: sa
        password:
        driver-class-name: org.h2.Driver
    jpa:
        hibernate:
            ddl-auto: create-drop

eureka:
  client:
    enabled: false

grpc:
  server:
    port: -1
    in-process-name: auth-test
  client:
    inProcess:
      address: in-process:auth-test

app:
  # Test không có audit-service
  audit:
    enabled: false
  # Test không có Redis: không ghi / xoá cache role + quyền
  security:
    authority-cache-enabled: false
  admin:
    email: admin@example.com
  # Keycloak được thay bằng FakeKeycloakAdmin (KeycloakTestConfig)
  keycloak:
    server-url: http://keycloak.invalid
    realm: ecommerce
    client-id: auth-service
    client-secret: test
