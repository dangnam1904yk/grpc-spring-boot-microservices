# Message của auth-service (tiếng Việt). Cùng bộ key với messages_en.properties.
# Key chung (error.required, error.invalid...) nằm ở common-grpc (i18n/common_vi.properties).
# Code đang truyền thẳng câu tiếng Việt (chưa có key) thì vẫn trả nguyên câu đó; chuyển dần sang key ở đây.
# Message có tham số đi qua MessageFormat: dấu ' viết thành '', số dùng {0,number,#}.

user.not-found=Tài khoản id={0} không tồn tại
user.email-exists=Email {0} đã được đăng ký
keycloak.unavailable=Không kết nối được tới Keycloak, vui lòng thử lại sau

# Đăng nhập bằng form của frontend (auth-service gọi Keycloak)
auth.invalid-credentials=Email hoặc mật khẩu không đúng
auth.account-locked=Tài khoản đã bị khoá
auth.account-not-ready=Tài khoản chưa được thiết lập xong, vui lòng liên hệ quản trị viên
auth.session-expired=Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại

# Tên field cho label của @CustomRequired, @CustomMaxLength...
user.label.email=Email
user.label.password=Mật khẩu
user.label.full-name=Họ tên
user.label.phone-number=Số điện thoại
auth.label.refresh-token=Refresh token
