# Messages of auth-service (English). Same keys as messages_vi.properties.
# Shared keys (error.required, error.invalid...) live in common-grpc (i18n/common_en.properties).
# Messages with arguments go through MessageFormat: write ' as '', use {0,number,#} for numbers.

user.not-found=User id={0} does not exist
user.email-exists=Email {0} is already registered
keycloak.unavailable=Cannot reach Keycloak, please try again later

# Login with the frontend's own form (auth-service calls Keycloak)
auth.invalid-credentials=Invalid email or password
auth.account-locked=This account is locked
auth.account-not-ready=This account is not fully set up, please contact an administrator
auth.session-expired=Your session has expired, please log in again

# Field names for the label of @CustomRequired, @CustomMaxLength...
user.label.email=Email
user.label.password=Password
user.label.full-name=Full name
user.label.phone-number=Phone number
auth.label.refresh-token=Refresh token
