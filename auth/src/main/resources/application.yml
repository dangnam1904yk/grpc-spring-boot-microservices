spring:
    application:
        name: auth-service
    cloud:
        config:
            enabled: false
    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/micro_auth?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:dangnam}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            maximum-pool-size: 20
            connection-timeout: 3000
    kafka:
        # Audit log được gửi vào topic audit-log (common-grpc: KafkaAuditSink)
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    jpa:
        open-in-view: false
        show-sql: false
        hibernate:
            ddl-auto: update

server:
    port: 9000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

grpc:
  client:
    audit-service:
      # Chỉ dùng khi app.audit.sender.transport=grpc (đường gửi audit log dự phòng)
      address: discovery:///audit-service
      negotiation-type: plaintext
      default-load-balancing-policy: round_robin

app:
  jwt:
    # Phải trùng app.security.issuer ở các service khác
    issuer: ${JWT_ISSUER:http://auth-service}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # Khoá ký JWT (PEM). Để trống -> tự sinh khoá tạm lúc khởi động (chỉ dùng cho dev:
    # restart là token cũ hết hiệu lực, và không chạy được nhiều instance auth-service)
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
  # Tạo sẵn tài khoản ADMIN lúc khởi động nếu chưa có (để trống thì bỏ qua)
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  audit:
    sender:
      # kafka (mặc định) hoặc grpc (dự phòng: gọi thẳng audit-service qua grpc.client.audit-service)
      transport: ${AUDIT_TRANSPORT:kafka}
      # Chỉ dùng khi transport=grpc: phải trùng app.audit-server.ingest-key của audit-service
      key: ${AUDIT_KEY:dev-audit-key}
