spring:
    application:
        name: auth-service
    cloud:
        config:
            enabled: false
    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:3306/micro_auth?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:dangnam}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            maximum-pool-size: 20
            connection-timeout: 3000
    jpa:
        open-in-view: false
        show-sql: false
        hibernate:
            ddl-auto: update

server:
    port: 9000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  jwt:
    # Phải trùng app.security.issuer ở các service khác
    issuer: ${JWT_ISSUER:http://auth-service}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    # Khoá ký JWT (PEM). Để trống -> tự sinh khoá tạm lúc khởi động (chỉ dùng cho dev:
    # restart là token cũ hết hiệu lực, và không chạy được nhiều instance auth-service)
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
  # Tạo sẵn tài khoản ADMIN lúc khởi động nếu chưa có (để trống thì bỏ qua)
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
