spring:
    application:
        name: api-gateway
    main:
        web-application-type: reactive
    cloud:
        config:
            enabled: false
        gateway:
            # Route khai báo bằng Java trong router/Router.java
            httpclient:
                connect-timeout: 2000
                # Service phản hồi chậm hơn mức này -> gateway trả lỗi, không giữ kết nối mãi
                response-timeout: 10s
                pool:
                    max-connections: 1000
                    acquire-timeout: 3000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

server:
  port: 8080

app:
  security:
    # Public key của auth-service để kiểm tra JWT ngay ở gateway
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:9000/api/auth/jwks}
    issuer: ${JWT_ISSUER:http://auth-service}
  cors:
    # Origin của frontend (ecommerce chạy Vite ở 5173), phân tách bằng dấu phẩy
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

resilience4j:
  circuitbreaker:
    configs:
      default:
        # Trong 20 request gần nhất, lỗi >= 50% thì mở mạch 10s, trả fallback ngay
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
  timelimiter:
    configs:
      default:
        # Mặc định của resilience4j chỉ 1s, quá ngắn cho request có gọi gRPC phía sau
        timeout-duration: 10s
