# Messages of customer-service (English). Same keys as messages_vi.properties.
# Shared keys (error.required, error.invalid...) live in common-grpc (i18n/common_en.properties).
# Messages with arguments go through MessageFormat: write ' as '', use {0,number,#} for numbers.

customer.not-found.id=Customer id={0} not found
customer.not-found.email=Customer email={0} not found
customer.batch.too-many=At most {0,number,#} ids per call
customer.profile.missing=You have not created a customer profile yet
customer.profile.exists=You already have a customer profile
customer.token.no-email=The token has no email
customer.email.used=Email {0} is already in use
customer.active.forbidden=Permission {0} is required to lock / unlock a customer
customer.version-conflict=Customer was changed by another request (current version={0})
customer.forbidden=No permission on customer id={0}
customer.get.key-required=Either id or email is required

# Used in annotations: @CustomRegex(message = "{customer.phone.invalid}", args = PHONE_EXAMPLE)
customer.phone.invalid=Invalid phone number, e.g. {arg0}

# Field names for the label of @CustomRequired, @CustomMaxLength...
customer.label.full-name=Full name
