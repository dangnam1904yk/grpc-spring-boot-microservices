# Message của customer-service (tiếng Việt). Cùng bộ key với messages_en.properties.
# Key chung (error.required, error.invalid...) nằm ở common-grpc (i18n/common_vi.properties).
# Message có tham số đi qua MessageFormat: dấu ' viết thành '', số dùng {0,number,#}.

customer.not-found.id=Customer id={0} không tồn tại
customer.not-found.email=Customer email={0} không tồn tại
customer.batch.too-many=Tối đa {0,number,#} id mỗi lần gọi
customer.profile.missing=Bạn chưa tạo hồ sơ customer
customer.profile.exists=Bạn đã có hồ sơ customer
customer.token.no-email=Token không có email
customer.email.used=Email {0} đã được sử dụng
customer.active.forbidden=Không có quyền {0} để khoá / mở khoá customer
customer.version-conflict=Customer đã bị thay đổi bởi request khác (version hiện tại={0})
customer.forbidden=Không có quyền với customer id={0}
customer.get.key-required=Phải truyền id hoặc email

# Dùng trong annotation: @CustomRegex(message = "{customer.phone.invalid}", args = PHONE_EXAMPLE)
customer.phone.invalid=Số điện thoại không hợp lệ, ví dụ: {arg0}

# Tên field cho label của @CustomRequired, @CustomMaxLength...
customer.label.full-name=Họ tên
