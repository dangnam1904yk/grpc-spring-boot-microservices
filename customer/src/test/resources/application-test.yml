spring:
    datasource:
        url: jdbc:h2:mem:customer;MODE=MySQL;DB_CLOSE_DELAY=-1
        username: sa
        password:
        driver-class-name: org.h2.Driver
    jpa:
        show-sql: false
        hibernate:
            ddl-auto: create-drop

eureka:
  client:
    enabled: false

grpc:
  server:
    port: -1
    in-process-name: customer-test
  client:
    inProcess:
      address: in-process:customer-test

app:
  # Test không có audit-service
  audit:
    enabled: false
  grpc:
    server:
      worker-threads: 8
      max-concurrent-calls: 50
