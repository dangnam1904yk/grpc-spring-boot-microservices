spring:
    cloud:
        config:
            enabled: false
    application:
        name: audit-service
    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/micro_audit?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:dangnam}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            maximum-pool-size: 20
            connection-timeout: 3000
    kafka:
        bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        consumer:
            group-id: audit-service
            # Lần đầu chạy (chưa có offset): đọc từ đầu topic, không bỏ log đã gửi trước khi audit-service bật
            auto-offset-reset: earliest
            # 1 lần poll = 1 transaction ghi DB
            max-poll-records: 500
        listener:
            type: batch
            # Mỗi partition 1 consumer; tăng nếu topic có nhiều partition hơn
            concurrency: 3
    jpa:
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                # Ghi cả lô log bằng 1 lần gửi SQL
                jdbc:
                    batch_size: 100
                order_inserts: true
        hibernate:
            ddl-auto: update

server:
    port: 8777
    tomcat:
        threads:
            max: 100
        accept-count: 200

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

grpc:
  server:
    port: 9094

app:
  security:
    # Public key của auth-service để kiểm tra JWT (API tra cứu, chỉ ADMIN)
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:9000/api/auth/jwks}
    issuer: ${JWT_ISSUER:http://auth-service}
  audit-server:
    topic: audit-log
    topic-partitions: 3
    # Đường gRPC dự phòng: service gửi log phải kèm đúng khoá này (app.audit.sender.key ở các service)
    ingest-key: ${AUDIT_KEY:dev-audit-key}
    # Xoá log cũ hơn 90 ngày, chạy lúc 3h sáng mỗi ngày
    retention: 90d
    cleanup-cron: "0 0 3 * * *"
  audit:
    # BẮT BUỘC tắt: bật thì mỗi lần lưu AuditLog lại sinh thêm 1 log thay đổi -> vòng lặp vô hạn
    entity-changes: false
    http:
      # Vẫn ghi ai tra cứu log, nhưng không lưu lại cả response (chính là log) -> log phình to
      exclude-response-body-paths:
        - /api/audit/**
  grpc:
    server:
      worker-threads: 32
      max-concurrent-calls: 200

logging:
  level:
    io.grpc: INFO
    net.devh: INFO
