# category (micro_category)
apiVersion: v1
kind: Service
metadata:
  name: mssql
spec:
  selector:
    app: mssql
  ports:
    - name: mssql
      port: 1433
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
spec:
  serviceName: mssql
  replicas: 1
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
    spec:
      enableServiceLinks: false
      securityContext:
        # Image chạy bằng user mssql (10001): cần quyền ghi vào volume
        fsGroup: 10001
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: MSSQL_SA_PASSWORD }
          ports:
            - containerPort: 1433
          readinessProbe:
            exec:
              command: ["sh", "-c", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 2Gi }
            limits: { memory: 3Gi }
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# SQL Server không tự tạo database như MySQL -> tạo micro_category một lần (lặp lại đến khi mssql sẵn sàng)
apiVersion: batch/v1
kind: Job
metadata:
  name: mssql-init
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 600
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: create-db
          image: mcr.microsoft.com/mssql/server:2022-latest
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: MSSQL_SA_PASSWORD }
          command:
            - /bin/sh
            - -c
            - /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P "$MSSQL_SA_PASSWORD" -b -Q "IF DB_ID('micro_category') IS NULL CREATE DATABASE micro_category"
