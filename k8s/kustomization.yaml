# Triển khai toàn bộ hệ thống lên Kubernetes:
#   1. Build + push image:      ./scripts/k8s-build-push.sh <registry> <tag>   (hoặc .ps1)
#   2. Sửa khối images bên dưới cho đúng registry/tag vừa push
#   3. Tạo secret:              cp k8s/secrets.env.example k8s/secrets.env  (rồi đổi mật khẩu)
#   4. Sửa CORS_ALLOWED_ORIGINS, KEYCLOAK_PUBLIC_URL, JWT_ISSUER bên dưới và host trong app/ingress.yaml
#      (redirect URI / web origin của client ecommerce-web trong keycloak/realm-ecommerce.json cũng phải có domain frontend)
#   5. kubectl apply -f k8s/namespace.yaml
#      kubectl -n grpc-ms create configmap keycloak-realm --from-file=keycloak/realm-ecommerce.json
#      kubectl apply -k k8s/
#      kubectl -n grpc-ms get pods -w      # lần đầu Oracle mất 1-2 phút, service restart vài lần là bình thường
#
# Đã có DB / Kafka riêng: bỏ "infra" khỏi resources và sửa MYSQL_HOST, MSSQL_HOST, ORACLE_URL,
# KAFKA_BOOTSTRAP_SERVERS bên dưới (SQL Server phải tạo sẵn database micro_category).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grpc-ms

resources:
  - namespace.yaml
  - infra
  - app

configMapGenerator:
  - name: app-config
    literals:
      - EUREKA_URL=http://discovery:8761/eureka
      # URL công khai của Keycloak (Ingress, app/ingress.yaml); token có iss = <URL này>/realms/ecommerce
      - KEYCLOAK_PUBLIC_URL=https://auth.example.com
      - JWT_ISSUER=https://auth.example.com/realms/ecommerce
      # Mọi service tự kiểm tra JWT bằng public key của Keycloak (gọi trong cụm)
      - JWT_JWKS_URI=http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      # auth-service gọi Keycloak Admin API
      - KEYCLOAK_URL=http://keycloak:8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Cache role + quyền theo user
      - REDIS_HOST=redis
      - AUDIT_TRANSPORT=kafka
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75
      # Bật /actuator/health/liveness và /readiness cho probe
      - MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MSSQL_HOST=mssql
      - MSSQL_PORT=1433
      - ORACLE_URL=jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      # Origin frontend được gọi API qua gateway (phân tách bằng dấu phẩy)
      - CORS_ALLOWED_ORIGINS=https://shop.example.com

secretGenerator:
  # Mật khẩu DB, Keycloak, AUDIT_KEY (xem secrets.env.example)
  - name: app-secrets
    envs:
      - secrets.env

images:
  - name: grpc-ms/discovery
    newName: registry.example.com/grpc-ms/discovery
    newTag: latest
  - name: grpc-ms/auth
    newName: registry.example.com/grpc-ms/auth
    newTag: latest
  - name: grpc-ms/category
    newName: registry.example.com/grpc-ms/category
    newTag: latest
  - name: grpc-ms/customer
    newName: registry.example.com/grpc-ms/customer
    newTag: latest
  - name: grpc-ms/business
    newName: registry.example.com/grpc-ms/business
    newTag: latest
  - name: grpc-ms/audit
    newName: registry.example.com/grpc-ms/audit
    newTag: latest
  - name: grpc-ms/apigateway
    newName: registry.example.com/grpc-ms/apigateway
    newTag: latest
