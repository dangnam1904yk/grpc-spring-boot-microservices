# MySQL micro_customer. business gọi qua gRPC :9093 (địa chỉ lấy từ Eureka)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      enableServiceLinks: false
      containers:
        - name: customer
          image: grpc-ms/customer
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - { name: DB_HOST, value: "$(MYSQL_HOST)" }
            - { name: DB_PORT, value: "$(MYSQL_PORT)" }
            - { name: DB_USERNAME, value: root }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: MYSQL_ROOT_PASSWORD }
            - name: AUDIT_KEY
              valueFrom:
                secretKeyRef: { name: app-secrets, key: AUDIT_KEY }
          ports:
            - { name: http, containerPort: 8990 }
            - { name: grpc, containerPort: 9093 }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 768Mi }
