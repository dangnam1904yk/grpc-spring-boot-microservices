# Quản trị user / role (qua Keycloak Admin API), ma trận phân quyền, menu. Gateway và service khác tìm auth qua
# Eureka (REST /api/auth/**, gRPC AuthorizationService) nên không cần k8s Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      enableServiceLinks: false
      containers:
        - name: auth
          image: grpc-ms/auth
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - { name: DB_HOST, value: "$(MYSQL_HOST)" }
            - { name: DB_PORT, value: "$(MYSQL_PORT)" }
            - { name: DB_USERNAME, value: root }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: MYSQL_ROOT_PASSWORD }
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: KEYCLOAK_CLIENT_SECRET }
            - name: AUDIT_KEY
              valueFrom:
                secretKeyRef: { name: app-secrets, key: AUDIT_KEY }
          ports:
            - { name: http, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 768Mi }
